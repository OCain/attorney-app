spring.application.name=attorney

# ==========================================
# Configurações do Banco de Dados (Padrão: H2 em memória com persistência local)
# Para usar PostgreSQL, execute com --spring.profiles.active=postgres
# ==========================================
spring.datasource.url=jdbc:h2:file:./data/attorneydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console para testes/inspeção visual em desenvolvimento
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# Thymeleaf & MVC
# ==========================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.web.resources.static-locations=classpath:/static/,file:./uploads/

# Upload de arquivos (fotos de perfil)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Diretório para upload de fotos
app.upload.dir=./uploads/profile-pictures/
