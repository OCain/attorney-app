<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cadastro de Advogado')}"></head>
<body>

<header th:replace="~{fragments/layout :: navbar}"></header>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container" style="padding: 3.5rem 1.5rem; max-width: 580px;">
    <div style="background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: var(--shadow-md);">
        <div style="margin-bottom: 2rem;">
            <a th:href="@{/cadastro}" style="font-size: 0.85rem; color: var(--text-muted); display: inline-flex; align-items: center; gap: 0.35rem; margin-bottom: 0.75rem;">
                <i class="fa-solid fa-arrow-left"></i> Voltar à seleção de perfil
            </a>
            <h1 style="font-size: 1.75rem; margin-bottom: 0.35rem;">Cadastro Profissional de Advogado</h1>
            <p style="font-size: 0.9rem;">Receba demandas de causas e conecte-se a clientes que buscam sua especialidade.</p>
        </div>

        <form th:action="@{/cadastro/advogado}" th:object="${advogado}" method="post">
            <div style="margin-bottom: 1.25rem;">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Nome Completo: *</label>
                <input type="text" th:field="*{nome}" class="form-control" placeholder="Dr(a). Nome e Sobrenome" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem;">
                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Nº Inscrição OAB: *</label>
                    <input type="text" th:field="*{oab}" class="form-control" placeholder="Ex: OAB/SP 123.456" required>
                </div>
                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Especialidade Principal: *</label>
                    <select th:field="*{especialidade}" class="form-control" required>
                        <option value="">Selecione...</option>
                        <option value="Direito do Trabalho">Direito do Trabalho</option>
                        <option value="Direito Civil">Direito Civil</option>
                        <option value="Direito de Família">Direito de Família</option>
                        <option value="Direito do Consumidor">Direito do Consumidor</option>
                        <option value="Direito Penal">Direito Penal</option>
                        <option value="Direito Tributário">Direito Tributário</option>
                        <option value="Direito Imobiliário">Direito Imobiliário</option>
                        <option value="Direito Previdenciário">Direito Previdenciário</option>
                        <option value="Direito Empresarial">Direito Empresarial</option>
                    </select>
                </div>
            </div>

            <div style="margin-bottom: 1.25rem;">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">E-mail Profissional: *</label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="advogado@escritorio.com" required>
            </div>

            <div style="margin-bottom: 1.25rem;">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Senha de Acesso: *</label>
                <input type="password" th:field="*{senha}" class="form-control" placeholder="Mínimo 6 caracteres" required>
            </div>

            <div style="margin-bottom: 1.25rem;">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Endereço do Escritório:</label>
                <input type="text" th:field="*{endereco}" class="form-control" placeholder="Rua, número, bairro, cidade - UF">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Telefone / WhatsApp de Contato:</label>
                <input type="text" th:field="*{telefone}" class="form-control" placeholder="(00) 00000-0000">
            </div>

            <button type="submit" class="btn btn-accent" style="width: 100%; justify-content: center; padding: 0.75rem;">
                <i class="fa-solid fa-scale-balanced"></i> Concluir Cadastro de Advogado
            </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem;">
            Já possui cadastro? <a th:href="@{/login}" style="font-weight: 600;">Faça login</a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
